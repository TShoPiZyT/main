<!doctype html>
<html>
<head>
    <title>TShoP/Homepage - Welcome!</title>
    <script>
window.onload = function() {
  const message = "TShoP/Homepage - Welcome!";
  let currentText = message;
  let isDisappearing = true;
  let index = message.length;
  const delay = 500;
  function animate() {
    if (isDisappearing) {
      if (currentText.length > 0) {
        currentText = currentText.slice(0, -1);
        document.title = currentText || " ";
        setTimeout(animate, delay);
      } else {
        isDisappearing = false;
        index = 0;
        setTimeout(animate, delay);
      }
    } else {
      if (index < message.length) {
        currentText += message.charAt(index);
        document.title = currentText;
        index++;
        setTimeout(animate, delay);
      } else {
        setTimeout(() => {
          isDisappearing = true;
          animate();
        }, 500);
      }
    }
  }
  animate();
};
</script>
    <style>
        .menu_elements {
            background-color: gray;
            padding: 10px;
            display: flex;
            align-items: center;
            font: bold 20px caption;
        }

        .menu_link_element {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .text_header {
            text-align: center;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="menu_elements">
            <a class="menu_link_element" href="https://google.com" target=_blank>Search</a>
            <a class="menu_link_element" href="https://duck.ai" target=_blank>AI</a>
            <a class="menu_link_element" href="https://github.com/TShoPiZyT" target=_blank>My Projects</a>
            <a class="menu_link_element" href="storage/pages/contact.html">Contact me</a>
			<a class="menu_link_element" id="loadFontsBtn" href="#">Enable Animations</a>
        </div>
        <div class="text_header">
            Welcome!
        </div>
		
    </header>

  <script>
  document.getElementById('loadFontsBtn').addEventListener('click', async () => {
    const header = document.querySelector('.text_header');

    try {
      // Вызов API после пользовательского клика
      const fonts = await window.queryLocalFonts();
      
      if (fonts.length === 0) {
        alert('Шрифты не найдены или API не вернул список.');
        return;
      }
      let index = 0;
      setInterval(() => {
        header.style.fontFamily = fonts[index];
        index = (index + 1) % fonts.length; // зацикливаем
      }, 150);
    } catch (error) {
      console.error('Error:', error);
      //alert('Не удалось получить шрифты. Возможно, требуется разрешение или API недоступен.');
    }
  });
</script>
</script>
</body>
</html>
